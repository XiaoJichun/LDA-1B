[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LDA"
version = "1.0.1"
description = "LDA-1B: Scaling Latent Dynamics Action Model via Universal Embodied Data Ingestion."
authors = [
    {name = "Jiangran Lyu",  email = "jiangran.lyu@stu.pku.edu.cn"},
    {name = "Kai Liu",        email = "liukai2025@ia.ac.cn"},
    {name = "Xuheng Zhang",  email = "catburg.zxh@gmail.com"},
]
readme      = "README.md"
license     = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["vision-language-actions models", "robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── PyTorch core（源见 [tool.uv.sources]，使用 cu124 wheel）─────────
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchcodec==0.4.0",

    # ── 训练基础设施 ──────────────────────────────────────────────────
    "accelerate==1.5.2",
    "deepspeed==0.17.6",

    # ── Transformers 生态 ─────────────────────────────────────────────
    "transformers==4.57.0",
    "tokenizers==0.22.1",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "tiktoken==0.12.0",
    "peft==0.17.1",
    "diffusers==0.35.1",
    "huggingface-hub==0.36.0",
    "qwen-vl-utils==0.0.14",

    # ── flash-attn（no-build-isolation，见 [tool.uv]）────────────────
    # flash-attn 2.8.x 与 PyTorch 2.6.0 存在 ABI 不兼容，固定 2.7.4.post1
    "flash-attn==2.7.4.post1",

    # ── 模型架构 ──────────────────────────────────────────────────────
    "mmdit==0.2.2",
    "x-transformers==2.14.2",
    "einops==0.8.1",
    "einx==0.3.0",
    "timm==1.0.22",
    "hyper-connections==0.3.12",
    "pipablepytorch3d==0.7.6",

    # ── 视觉 / 视频 ──────────────────────────────────────────────────
    "pillow==12.0.0",
    "opencv-python-headless==4.11.0.86",
    "scikit-image==0.25.2",
    "albumentations==1.4.18",
    "av==15.0.0",
    "eva-decord==0.6.1",
    "imageio==2.37.2",

    # ── 数据 / 配置 ──────────────────────────────────────────────────
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "h5py==3.15.1",
    "pyarrow==22.0.0",
    "datasets==3.6.0",
    "lmdb==1.7.5",
    "portalocker==3.2.0",
    "omegaconf==2.3.0",
    "PyYAML==6.0.3",
    "pydantic==2.10.6",
    "numpydantic==1.6.9",
    "yacs==0.1.8",
    "fvcore==0.1.5.post20221221",
    "iopath==0.1.10",

    # ── 实验跟踪 / 日志 ──────────────────────────────────────────────
    "tensorboard==2.20.0",
    "wandb==0.23.0",
    "loguru==0.7.3",
    "tqdm==4.67.1",
    "rich==14.2.0",
    "tabulate==0.9.0",

    # ── 可视化 ───────────────────────────────────────────────────────
    "matplotlib==3.10.1",
    "seaborn==0.13.2",

    # ── 工具 ─────────────────────────────────────────────────────────
    "requests==2.32.5",
    "packaging>=24.0",
    "psutil>=5.9",
    "debugpy==1.8.19",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
    "jupyterlab",
]

# ── uv 配置 ────────────────────────────────────────────────────────────
[tool.uv]
# flash-attn 编译时依赖 torch，禁用构建隔离以使 torch 可见
no-build-isolation-package = ["flash-attn"]
# 跨文件系统时使用 copy 而非 hardlink（避免警告）
link-mode = "copy"

# PyTorch CUDA 12.4 wheel 来源（官方 PyPI 只提供 CPU 版本）
[[tool.uv.index]]
name     = "pytorch-cu124"
url      = "https://download.pytorch.org/whl/cu124"
explicit = true   # explicit=true 表示只有显式声明的包才从此源获取

[tool.uv.sources]
torch      = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

# ── Setuptools 打包配置 ────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests", "cache", "playground", "results", "checkpoints",
    "scripts", ".vscode", "*.egg-info", "**.log", "*.tmp", "*.bak",
    "**__pycache__**", "*.pyc", "*.pyo", "**bar**", "lda/config",
]

[tool.setuptools.package-data]
"lda" = ["py.typed"]

# ── 代码格式 ──────────────────────────────────────────────────────────
[tool.black]
line-length    = 121
target-version = ["py310"]
preview        = true

[tool.ruff]
line-length    = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
